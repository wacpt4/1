<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DW德语学习助手</title>
<style>
/* ==========================================
   🎨 CSS 变量：定义浅色和深色主题
   ========================================== */
:root {
    --bg-gradient: linear-gradient(135deg, #f3f0ff, #e5dbff);
    --text-main: #3b286d;
    --text-sub: #705da4;
    --text-card-big: #4338ca;
    --text-card-small: #6b7280;
    --btn-bg: rgba(255, 255, 255, 0.6);
    --btn-color: #5f4bb6;
    --btn-active-bg: #5f4bb6;
    --btn-active-color: white;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-hover-bg: rgba(255, 255, 255, 0.95);
    --card-shadow: 0 4px 14px rgba(147, 130, 219, 0.15);
    --card-hover-shadow: 0 6px 20px rgba(147, 130, 219, 0.25);
    --card-border: rgba(255, 255, 255, 0.6);
    --card-playing-bg: #e0e7ff;
    --card-playing-border: #6366f1;
    --star-color: #d1d5db;
    --star-active-color: #fbbf24;

    /* 💬 聊天对话专属颜色 */
    --chat-left-bg: rgba(255, 255, 255, 0.95);
    --chat-right-bg: #e8e5ff;
    --chat-avatar-bg: #5f4bb6;

    /* 🎮 练习模式与拼词模式通用颜色 */
    --match-selected: #cbd5e1;
    --match-success-bg: #e2fbe8;
    --match-success-border: #22c55e;
    --match-success-text: #15803d;
    --match-error-bg: #fef2f2;
    --match-error-border: #ef4444;
    --match-error-text: #b91c1c;

    /* 🧩 拼词/提示框专属适配 */
    --builder-prompt-bg: rgba(255, 255, 255, 0.6);
    --builder-zone-bg: rgba(255, 255, 255, 0.3);
    --hint-bg: rgba(34, 197, 94, 0.15);
    --hint-border: #22c55e;
    --hint-text: #15803d;
}

[data-theme="dark"] {
    --bg-gradient: linear-gradient(135deg, #1e1b4b, #311042);
    --text-main: #f3f4f6;
    --text-sub: rgba(255, 255, 255, 0.6);
    --text-card-big: #a5b4fc;
    --text-card-small: #cbd5e1;
    --btn-bg: rgba(255, 255, 255, 0.1);
    --btn-color: #c7d2fe;
    --btn-active-bg: #6366f1;
    --btn-active-color: white;
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-hover-bg: rgba(255, 255, 255, 0.15);
    --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    --card-hover-shadow: 0 6px 20px rgba(99, 102, 241, 0.2);
    --card-border: rgba(255, 255, 255, 0.1);
    --card-playing-bg: rgba(99, 102, 241, 0.35);
    --card-playing-border: #818cf8;
    --star-color: rgba(255, 255, 255, 0.2);
    --star-active-color: #fbbf24;

    /* 💬 聊天对话专属颜色 */
    --chat-left-bg: rgba(255, 255, 255, 0.08);
    --chat-right-bg: rgba(95, 75, 182, 0.3);
    --chat-avatar-bg: #818cf8;

    /* 🎮 连连看练习模式专属颜色 */
    --match-selected: rgba(99, 102, 241, 0.4);
    --match-success-bg: rgba(34, 197, 94, 0.2);
    --match-success-border: #22c55e;
    --match-success-text: #86efac;
    --match-error-bg: rgba(239, 68, 68, 0.2);
    --match-error-border: #f87171;
    --match-error-text: #fca5a5;

    /* 🧩 拼词/提示框深色模式优化 */
    --builder-prompt-bg: rgba(255, 255, 255, 0.08);
    --builder-zone-bg: rgba(0, 0, 0, 0.25);
    --hint-bg: rgba(34, 197, 94, 0.2);
    --hint-border: #4ade80;
    --hint-text: #86efac;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
}
.header { text-align: center; padding: 25px; position: relative; }
.header p { color: var(--text-sub); margin-top: 5px; }

/* 右上角按钮栏 */
.header-actions {
    position: absolute;
    right: 20px;
    top: 20px;
    display: flex;
    gap: 10px;
}

.theme-toggle, .pet-toggle {
    padding: 10px 16px; font-size: 14px;
    background: var(--btn-bg); color: var(--btn-color); border-radius: 20px; box-shadow: var(--card-shadow);
    cursor: pointer; border: none; transition: 0.2s;
}
.theme-toggle:hover, .pet-toggle:hover { background: var(--card-hover-bg); }

.tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; padding: 0 10px; }
button {
    border: none; padding: 12px 22px; border-radius: 12px; cursor: pointer; font-size: 15px;
    background: var(--btn-bg); color: var(--btn-color); transition: 0.2s; box-shadow: var(--card-shadow);
    -webkit-tap-highlight-color: transparent;
}
button:hover { background: var(--card-hover-bg); }
.tabs button.active { background: var(--btn-active-bg); color: var(--btn-active-color); font-weight: bold; }

.page { display: none; max-width: 1200px; margin: auto; padding: 20px; box-sizing: border-box; }
.page.show { display: block !important; }

/* 🖼️ 卡片图片样式 */
.card-img {
    max-width: 100%; max-height: 130px; object-fit: contain;
    border-radius: 10px; margin-bottom: 10px; display: block;
    margin-left: auto; margin-right: auto; pointer-events: none;
}

/* 🧱 基础网格布局 */
.grid-word { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
.grid-word .big { font-size: 1.4rem; font-weight: bold; color: var(--text-card-big); }
.grid-word .small { font-size: 1rem; margin-top: 8px; color: var(--text-card-small); }

.grid-phrase { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
.grid-phrase .big { font-size: 1.25rem; font-weight: bold; color: var(--text-card-big); }
.grid-phrase .small { font-size: 1.05rem; margin-top: 6px; color: var(--text-card-small); }

.grid-sentence { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 15px; }
.grid-sentence .card { text-align: left; padding: 20px; }
.grid-sentence .big { font-size: 1.2rem; font-weight: bold; line-height: 1.4; color: var(--text-card-big); }
.grid-sentence .small { font-size: 1.05rem; margin-top: 8px; color: var(--text-card-small); line-height: 1.4; }

.grid-long-sentence { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; }
@media (max-width: 600px) { .grid-long-sentence { grid-template-columns: 1fr; } }
.grid-long-sentence .card { text-align: left; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.grid-long-sentence .big { font-size: 1.15rem; font-weight: bold; line-height: 1.5; color: var(--text-card-big); border-bottom: 1px dashed var(--card-border); padding-bottom: 8px; padding-right: 25px; }
.grid-long-sentence .small { font-size: 1.05rem; line-height: 1.6; color: var(--text-card-small); margin: 0; }
.grid-long-sentence .card-img { max-height: 180px; align-self: center; }

/* 🚨 对话布局 */
.grid-dialogue { display: flex; flex-direction: column; gap: 20px; width: 100%; padding: 10px; box-sizing: border-box; }
.dialogue-row { display: flex; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
.dialogue-row.left { justify-content: flex-start; }
.dialogue-row.right { justify-content: flex-end; }
.dialogue-content { display: flex; gap: 14px; max-width: 75%; align-items: flex-start; }
.dialogue-row.left .dialogue-content { flex-direction: row; }
.dialogue-row.right .dialogue-content { flex-direction: row-reverse; }
.chat-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--chat-avatar-bg); color: white;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; box-shadow: var(--card-shadow); flex-shrink: 0;          
}
.dialogue-content .card { display: block; width: auto; text-align: left; padding: 16px 22px; border-radius: 20px; box-sizing: border-box; }
.dialogue-row.left .card { background: var(--chat-left-bg); border-top-left-radius: 4px; }
.dialogue-row.right .card { background: var(--chat-right-bg); border-top-right-radius: 4px; }
.dialogue-content .card .big { font-size: 1.15rem; font-weight: bold; color: var(--text-main); line-height: 1.5; padding-right: 25px; text-align: left; }
.dialogue-content .card .small { font-size: 1rem; margin-top: 6px; color: var(--text-card-small); line-height: 1.45; text-align: left; }

/* 公共卡片样式 */
.card {
    position: relative; background: var(--card-bg); backdrop-filter: blur(10px);
    padding: 24px 18px 18px 18px; border-radius: 18px; text-align: center; cursor: pointer;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
    box-shadow: var(--card-shadow); border: 1px solid var(--card-border); user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.card:hover { transform: translateY(-3px); background: var(--card-hover-bg); box-shadow: var(--card-hover-shadow); }
.star-icon {
    position: absolute; top: 14px; right: 16px; font-size: 1.1rem; color: var(--star-color);
    cursor: pointer; transition: transform 0.1s, color 0.2s; user-select: none; z-index: 10;
}
.star-icon:hover { transform: scale(1.2); }
.star-icon.active { color: var(--star-active-color); filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.4)); }
.card.playing { background: var(--card-playing-bg) !important; border-color: var(--card-playing-border) !important; transform: scale(1.02) translateY(-1px); }

/* 🚀 左上角悬浮播放面板 */
.play-panel { position: fixed; left: 20px; top: 20px; z-index: 9999; display: flex; gap: 8px; flex-wrap: wrap; }
.autoplay-btn, .practice-mode-btn, .builder-mode-btn, .image-mode-btn { 
    font-size: 14px; padding: 10px 16px; border-radius: 20px; background: #6366f1; color: white;
    font-weight: bold; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); transition: 0.2s;
}
.autoplay-btn:hover, .practice-mode-btn:hover, .builder-mode-btn:hover, .image-mode-btn:hover { background: #4f46e5; transform: scale(1.05); }
.autoplay-btn.playing, .practice-mode-btn.active, .builder-mode-btn.active, .image-mode-btn.active { background: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
.empty-tip { text-align: center; padding: 40px; color: var(--text-sub); font-style: italic; font-size: 1.1rem; }

/* 🎮 练习模式与互动系统 UI */
.practice-container {
    max-width: 800px; margin: 20px auto; padding: 24px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 24px; box-shadow: var(--card-shadow); backdrop-filter: blur(10px);
}
.practice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; flex-wrap: wrap; gap: 10px;}
.practice-header h3 { margin: 0; color: var(--text-main); font-size: 1.2rem; }

/* 模块左上角子模式控制栏 */
.sub-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub-btn {
    font-size: 12px; padding: 6px 12px; border-radius: 12px; background: var(--btn-bg);
    color: var(--btn-color); border: 1px solid var(--card-border); cursor: pointer; transition: 0.2s; font-weight: bold;
}
.sub-btn.active { background: #6366f1; color: white; border-color: #6366f1; }

.page-controls { display: flex; align-items: center; gap: 8px; }
.nav-arrow {
    padding: 5px 12px; font-size: 14px; border-radius: 8px; background: var(--btn-bg);
    color: var(--btn-color); border: 1px solid var(--card-border); cursor: pointer; transition: 0.15s;
}
.nav-arrow:hover:not(:disabled) { transform: scale(1.1); background: var(--card-hover-bg); }
.nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

.practice-board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.practice-column { display: flex; flex-direction: column; gap: 14px; }
.practice-card {
    padding: 18px 14px; font-size: 1.05rem; font-weight: 500; border-radius: 16px;
    text-align: center; background: var(--card-bg); border: 2px solid var(--card-border);
    color: var(--text-main); box-shadow: var(--card-shadow); cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
    min-height: 36px; display: flex; align-items: center; justify-content: center; user-select: none;
}
.practice-card:hover { transform: translateY(-2px); background: var(--card-hover-bg); }
.practice-card.selected { background: var(--match-selected) !important; border-color: var(--btn-active-bg) !important; transform: scale(0.97); }
.practice-card.success {
    animation: successPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    background: var(--match-success-bg) !important; border-color: var(--match-success-border) !important;
    color: var(--match-success-text) !important; cursor: default; pointer-events: none;
}
.practice-card.error { animation: errorShake 0.4s ease-in-out; background: var(--match-error-bg) !important; border-color: var(--match-error-border) !important; color: var(--match-error-text) !important; }

/* 🔊 连连看静态/动态波形图案 */
.wave-container { display: flex; align-items: center; justify-content: center; gap: 5px; height: 26px; }
.wave-icon { font-size: 1.2rem; margin-right: 4px; }
.wave-bar { width: 4px; background-color: var(--btn-color); border-radius: 3px; height: 6px; transition: height 0.2s; }
.wave-bar.static:nth-child(1) { height: 8px; }
.wave-bar.static:nth-child(2) { height: 16px; }
.wave-bar.static:nth-child(3) { height: 22px; }
.wave-bar.static:nth-child(4) { height: 14px; }
.wave-bar.static:nth-child(5) { height: 20px; }
.wave-bar.static:nth-child(6) { height: 10px; }

.wave-container.playing .wave-bar { animation: audioDance 0.6s ease-in-out infinite alternate; }
.wave-container.playing .wave-bar:nth-child(1) { animation-delay: 0.1s; }
.wave-container.playing .wave-bar:nth-child(2) { animation-delay: 0.3s; }
.wave-container.playing .wave-bar:nth-child(3) { animation-delay: 0.15s; }
.wave-container.playing .wave-bar:nth-child(4) { animation-delay: 0.4s; }
.wave-container.playing .wave-bar:nth-child(5) { animation-delay: 0.25s; }
.wave-container.playing .wave-bar:nth-child(6) { animation-delay: 0.35s; }

@keyframes audioDance {
    0% { height: 4px; }
    100% { height: 24px; background-color: #6366f1; }
}

/* 🧩 拼词/拼单词 UI 样式 */
.builder-target-prompt {
    font-size: 1.25rem; font-weight: bold; color: var(--text-card-big); margin-bottom: 20px;
    text-align: center; line-height: 1.4; padding: 14px; background: var(--builder-prompt-bg);
    border: 1px solid var(--card-border); border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.speaker-btn {
    background: var(--btn-bg); color: var(--btn-color); border: 1px solid var(--card-border);
    border-radius: 50%; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem; padding: 0; box-shadow: var(--card-shadow); transition: 0.15s;
}
.speaker-btn:hover { transform: scale(1.1); background: var(--card-hover-bg); }

.builder-answer-zone {
    min-height: 65px; background: var(--builder-zone-bg); border: 2px solid var(--card-border);
    border-radius: 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center; padding: 12px; transition: border-color 0.3s, background 0.3s;
}
.builder-answer-zone.error { border-color: var(--match-error-border) !important; background: var(--match-error-bg) !important; animation: errorShake 0.4s ease-in-out; }
.builder-answer-zone.success { border-color: var(--match-success-border) !important; background: var(--match-success-bg) !important; }

.correct-answer-hint {
    margin-bottom: 15px; padding: 12px 18px; background: var(--hint-bg); border: 1px solid var(--hint-border);
    border-radius: 12px; color: var(--hint-text); font-weight: bold; font-size: 1.05rem; text-align: center; display: none; box-shadow: var(--card-shadow);
}
.correct-answer-hint.show { display: block; animation: fadeIn 0.3s ease-in-out; }

.builder-pool-zone { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 80px; margin-bottom: 20px; }
.tile-btn {
    padding: 10px 18px; font-size: 1.1rem; font-weight: bold; border-radius: 14px;
    background: var(--card-bg); border: 2px solid var(--card-border); box-shadow: var(--card-shadow);
    color: var(--text-main); cursor: pointer; transition: transform 0.15s, background 0.2s; user-select: none;
}
.tile-btn:hover { transform: translateY(-2px); background: var(--card-hover-bg); }
.tile-btn.disabled { opacity: 0.2; pointer-events: none; transform: none; box-shadow: none; }
.builder-actions { display: flex; justify-content: center; gap: 15px; }
.btn-check { background: #22c55e; color: white; font-weight: bold; padding: 12px 30px; border-radius: 16px; font-size: 1.05rem; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
.btn-check:hover { background: #16a34a; }
.btn-clear { background: var(--btn-bg); color: var(--text-main); padding: 12px 20px; border-radius: 16px; border: 1px solid var(--card-border); }

/* ⌨️ 德语软键盘样式 */
.virtual-keyboard {
    display: flex; flex-direction: column; gap: 8px; align-items: center; margin-bottom: 20px; margin-top: 10px;
}
.keyboard-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; width: 100%; }
.key-btn {
    min-width: 36px; height: 42px; padding: 0 8px; font-size: 1rem; font-weight: bold; border-radius: 8px;
    background: var(--btn-bg); border: 1px solid var(--card-border); color: var(--text-main);
    box-shadow: var(--card-shadow); cursor: pointer; transition: 0.15s; display: flex; align-items: center; justify-content: center;
}
.key-btn:hover { background: var(--card-hover-bg); transform: translateY(-2px); }
.key-btn:active { transform: translateY(0); }
.key-btn.wide { min-width: 65px; }
.key-btn.space { min-width: 140px; }

/* 🖼️ 听音选图模式样式 */
.image-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 20px; }
.image-choice-card {
    background: var(--card-bg); border: 3px solid var(--card-border); border-radius: 18px;
    padding: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--card-shadow); transition: transform 0.2s, border-color 0.2s; min-height: 140px;
}
.image-choice-card:hover { transform: translateY(-3px); background: var(--card-hover-bg); }
.image-choice-card img { max-width: 100%; max-height: 120px; object-fit: contain; pointer-events: none; }
.image-choice-card.success { animation: successPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; background: var(--match-success-bg) !important; border-color: var(--match-success-border) !important; }
.image-choice-card.error { animation: errorShake 0.4s ease-in-out; background: var(--match-error-bg) !important; border-color: var(--match-error-border) !important; }

/* 🌟 多邻国风格反馈与奖励动画 */
.score-board {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(99, 102, 241, 0.1); padding: 10px 18px; border-radius: 16px; margin-bottom: 15px; font-weight: bold; color: var(--text-main);
}
.streak-badge { color: #f59e0b; font-size: 1.1rem; }

/* 🎆 通关全屏视觉反馈 Overlay */
.celebration-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
    z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.celebration-overlay.show { opacity: 1; pointer-events: auto; }
.celebration-card {
    background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 28px; padding: 40px 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transform: scale(0.7); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 90%; width: 400px;
}
.celebration-overlay.show .celebration-card { transform: scale(1); }
.celebration-title { font-size: 2.2rem; font-weight: 900; color: #fbbf24; text-shadow: 0 4px 12px rgba(251, 191, 36, 0.4); margin-bottom: 10px; }
.celebration-subtitle { font-size: 1.2rem; color: #e2e8f0; margin-bottom: 25px; }
.celebration-badge { font-size: 4rem; margin-bottom: 15px; animation: bounceIcon 1s infinite alternate; }
.celebration-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a); color: white; font-weight: bold;
    font-size: 1.1rem; padding: 14px 36px; border-radius: 18px; border: none; cursor: pointer;
    box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); transition: transform 0.2s;
}
.celebration-btn:hover { transform: scale(1.05); }

/* ==========================================
   🐾 陪伴宠物系统专属 CSS 样式
   ========================================== */
.pet-container {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    transition: left 0.8s ease-in-out, top 0.8s ease-in-out, transform 0.3s, opacity 0.3s ease;
}
.pet-container.hide-pet {
    display: none !important;
}
.pet-container * {
    pointer-events: auto;
}
.pet-dialog {

}

    opacity: 1;
    transform: translateY(0) scale(1);

    transform: scale(0.95);

function initPetVisibility() {
    const container = document.getElementById('petContainer');
    const toggleBtn = document.getElementById('petToggleBtn');
    if (!container || !toggleBtn) return;
    
    if (petData.visible === false) {
        container.classList.add('hide-pet');
        toggleBtn.style.opacity = '0.5';
    } else {
        container.classList.remove('hide-pet');
        toggleBtn.style.opacity = '1';
    }
}

function togglePetVisibility() {
    petData.visible = !(petData.visible !== false);
    savePetData();
    initPetVisibility();
}

function startHungerTick() {
    if (hungerTimer) clearInterval(hungerTimer);
    hungerTimer = setInterval(() => {
        if (!isSleeping) {
            petData.hunger = Math.max(0, petData.hunger - 1);
            savePetData();
        }
    }, 20000);
}

function resetIdleTimer() {
    if (isSleeping) wakeUpPet();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        enterSleepMode();
    }, 45000);
}

function enterSleepMode() {
    isSleeping = true;
    const container = document.getElementById('petContainer');
    if (container) container.classList.add('pet-sleeping');

function wakeUpPet() {

    const container = document.getElementById('petContainer');

['click', 'mousemove', 'keydown', 'touchstart'].forEach(evt => {

});

function savePetData() {
    localStorage.setItem('german_pet_data', JSON.stringify(petData));
    updatePetUI();
}

function updatePetUI() {
    const levelText = document.getElementById('petNameTitle');
    const expText = document.getElementById('petExpText');
    const expBar = document.getElementById('petExpBar');
    const hungerText = document.getElementById('petHungerText');
    const hungerBar = document.getElementById('petHungerBar');
    const foodCount = document.getElementById('foodCountText');
    const feedBtn = document.getElementById('feedPetBtn');
    const container = document.getElementById('petContainer');

    if (!levelText) return;

    levelText.innerText = `🦮 旺财 (Lv.${petData.level})`;

    const maxExp = petData.level * 60 + 40;
    expText.innerText = `${petData.exp}/${maxExp}`;
    expBar.style.width = `${Math.min(100, (petData.exp / maxExp) * 100)}%`;

    hungerText.innerText = `${petData.hunger}/100`;
    hungerBar.style.width = `${petData.hunger}%`;

    foodCount.innerText = petData.food;
    feedBtn.disabled = petData.food <= 0;

    if (container) {
        container.classList.remove('pet-stage-1', 'pet-stage-2', 'pet-stage-3');
        if (petData.level < 3) {
            container.classList.add('pet-stage-1');
        } else if (petData.level < 6) {
            container.classList.add('pet-stage-2');
        } else {
            container.classList.add('pet-stage-3');
        }
    }

    const statusCard = document.getElementById('petStatusCard');
    const collapseBtn = document.getElementById('collapseToggleBtn');
    if (statusCard && collapseBtn) {
        if (petData.isCollapsed) {
            statusCard.classList.add('collapsed');
            collapseBtn.innerText = "➕";
        } else {
            statusCard.classList.remove('collapsed');
            collapseBtn.innerText = "➖";
        }
    }
}

function togglePetStatusCollapse() {
    petData.isCollapsed = !petData.isCollapsed;
    savePetData();
}

function showPetDialog(text, playVoice = true) {
    if (petData.visible === false) return;
    const dialog = document.getElementById('petDialog');
    if (!dialog) return;
    dialog.innerText = text;
    dialog.classList.add('show');

    if (playVoice) {
        const cleanMsg = text.replace(/[\u4e00-\u9fa5]/g, '').replace(/[^\w\s,'!?]/gi, '');
        if (cleanMsg.trim().length > 0) speak(cleanMsg);
    }

    setTimeout(() => { dialog.classList.remove('show'); }, 3200);
}

function interactWithPet() {
    resetIdleTimer();
    const petBody = document.getElementById('petBody');
    if (petBody) {
        petBody.classList.remove('pet-happy-jump');
        void petBody.offsetWidth;
        petBody.classList.add('pet-happy-jump');
    }
    const randomMsg = petDialogueList.idle[Math.floor(Math.random() * petDialogueList.idle.length)];
    showPetDialog(randomMsg);
}

function addPetExp(amount) {
    petData.exp += amount;
    const maxExp = petData.level * 60 + 40;
    if (petData.exp >= maxExp) {
        petData.exp -= maxExp;
        petData.level++;
        showPetDialog(`🎉 Level Up! 旺财升级到 Lv.${petData.level} 啦！`, false);
        playSoundEffect('victory');
    }
    savePetData();
}

function feedPet() {
    if (petData.food <= 0) return;
    petData.food--;
    petData.hunger = Math.min(100, petData.hunger + 30);
    addPetExp(15);
    interactWithPet();
    showPetDialog("Lecker! 🍖 旺财最喜欢吃肉骨头啦！", true);
}

function playWithBall() {
    interactWithPet();
    petData.hunger = Math.max(0, petData.hunger - 5);
    addPetExp(10);
    showPetDialog("Wuff! 🎾 扔网球游戏太好玩啦！", false);
}

function toggleWanderMode() {
    isWandering = !isWandering;
    const btn = document.getElementById('wanderBtn');
    const container = document.getElementById('petContainer');

    if (isWandering) {
        btn.classList.add('active');

    const container = document.getElementById('petContainer');
    const movePet = () => {
        if (!isWandering) return;
        const screenW = window.innerWidth - 120;
        const screenH = window.innerHeight - 180;
        const targetX = Math.max(20, Math.floor(Math.random() * screenW));

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSoundEffect(type) {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    const now = audioCtx.currentTime;

    if (type === 'success') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); 
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); 
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'error') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (type === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.50]; 
        notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            const startTime = now + idx * 0.08;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
            osc.start(startTime);
            osc.stop(startTime + 0.4);
        });
    }
}

function triggerConfetti(x, y) {
    const cx = x || window.innerWidth / 2;
    const cy = y || window.innerHeight / 2;
    for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'confetti';
        document.body.appendChild(particle);
        const dx = (Math.random() - 0.5) * 260;
        const dy = (Math.random() - 0.5) * 260;
        particle.style.left = `${cx}px`;
        particle.style.top = `${cy}px`;
        particle.style.setProperty('--dx', `${dx}px`);
        particle.style.setProperty('--dy', `${dy}px`);
        const colors = ['#fbbf24', '#22c55e', '#6366f1', '#ec4899', '#3b82f6'];
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        setTimeout(() => particle.remove(), 800);
    }
}

        currentStreak++;

        if (currentStreak % 3 === 0) rewardPetFood(1);

function toggleTheme() {
    const currentTheme = document.body.getAttribute('data-theme');
    if (currentTheme === 'dark') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', 'dark');
}

function speak(text, callback, onStart) {
    let cleanedText = text;
    if (text.length === 1 && text === text.toUpperCase()) { cleanedText = text.toLowerCase(); }
    
    const u = new SpeechSynthesisUtterance(cleanedText);
    u.lang = "de-DE";
    if (onStart) u.onstart = () => onStart();
    if (callback) {
        u.onend = () => callback();
        u.onerror = () => callback();
    }
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

function toggleStar(e, pageKey, itemIndex) {
    e.stopPropagation(); 
    const item = appData[pageKey].items[itemIndex];
    const uniqueId = `${pageKey}-${itemIndex}`;
    const existingIndex = starredItems.findIndex(x => x.id === uniqueId);
    
    if (existingIndex > -1) {
        starredItems.splice(existingIndex, 1);
        document.querySelectorAll(`.star-${uniqueId}`).forEach(el => el.classList.remove('active'));
    } else {
        starredItems.push({
            id: uniqueId, pageKey: pageKey,
            layout: appData[pageKey].layout, speakType: appData[pageKey].speakType,
            data: item
        });
        document.querySelectorAll(`.star-${uniqueId}`).forEach(el => el.classList.add('active'));
    }
    localStorage.setItem('german_helper_stars', JSON.stringify(starredItems));
    renderReviewPage();
}

function renderReviewPage() {
    const reviewGrid = document.getElementById('review-grid');
    if (!reviewGrid) return;
    reviewGrid.removeAttribute('class'); 
    reviewGrid.innerHTML = '';
    
    if (starredItems.length === 0) {
        reviewGrid.innerHTML = `<div class="empty-tip">⭐ 还没有标记重点。点击其他页面卡片上的星星，不熟的内容会同步到这里哦！</div>`;
        return;
    }
    
    reviewGrid.className = 'grid-sentence'; 
    starredItems.forEach((fav) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'grid-sentence'; 
        
        const isDialogue = fav.layout === 'dialogue';
        const imgUrl = isDialogue ? fav.data[3] : fav.data[2];
        const imgHtml = imgUrl ? `<img src="${imgUrl}" class="card-img" alt="illustration">` : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="star-icon active star-${fav.id}" onclick="toggleStar(event, '${fav.pageKey}', ${fav.id.split('-')[1]})">★</span>
            ${imgHtml}
            <div class='big'>${fav.data[0]}</div>
            <div class='small'>${fav.data[1]}</div>
        `;
        const textToSpeak = fav.speakType === 'key' ? fav.data[0] : fav.data[1];
        card.onclick = () => { stopAutoplay(); speak(textToSpeak); };
        wrapper.appendChild(card);
        reviewGrid.appendChild(wrapper);
    });
}

function stopAutoplay() {
    isAutoplayRunning = false;
    speechSynthesis.cancel();
    document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
    const btn = document.getElementById('autoPlayBtn');
    if(btn) { btn.innerHTML = "▶"; btn.classList.remove('playing'); }
}

function toggleAutoPlay() {
    if (isPracticeModeActive) quitPracticeMode();
    if (isBuilderModeActive) quitBuilderMode();
    if (isImageModeActive) quitImageMode();

    if (isAutoplayRunning) {
        stopAutoplay();
    } else {
        isAutoplayRunning = true;
        currentPlayIndex = 0;
        const btn = document.getElementById('autoPlayBtn');
        btn.innerHTML = "⏸";
        btn.classList.add('playing');
        startAutoplay();
    }
}

function startAutoplay() {
    const activePage = document.getElementById(`page-${currentActivePageId}`);
    if (!activePage) return;
    const cards = activePage.querySelectorAll('.card');
    
    if (currentPlayIndex >= cards.length || cards.length === 0) {
        stopAutoplay();
        return;
    }

    cards.forEach(c => c.classList.remove('playing'));
    const currentCard = cards[currentPlayIndex];
    if (!currentCard) { stopAutoplay(); return; }
    
    currentCard.classList.add('playing');
    currentCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    let textToSpeak = "";
    if (currentActivePageId === 'review') {
        const fav = starredItems[currentPlayIndex];
        textToSpeak = fav ? (fav.speakType === 'key' ? fav.data[0] : fav.data[1]) : "";
    } else {
        const pageConfig = appData[currentActivePageId];
        const itemData = pageConfig.items[currentPlayIndex];
        textToSpeak = pageConfig.speakType === 'key' ? itemData[0] : itemData[1];
    }

    speak(textToSpeak, () => {
        if (!isAutoplayRunning) return;
        currentPlayIndex++;
        setTimeout(() => { if (isAutoplayRunning) startAutoplay(); }, 1400); 
    });
}

// 页面搭建与初始化
function switchPage(pageId) {
    if (isAutoplayRunning) stopAutoplay();
    currentActivePageId = pageId;

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === pageId);
    });

    document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('show');
        p.style.display = 'none';
    });

    const targetPage = document.getElementById(`page-${pageId}`);
    if (targetPage) {
        targetPage.classList.add('show');
        targetPage.style.display = 'block';
    }

    if (pageId === 'review') renderReviewPage();
}

function initApp() {
    const tabsContainer = document.getElementById('tabsContainer');
    const pagesContainer = document.getElementById('pagesContainer');

    // 默认添加“复习”标签
    const reviewBtn = document.createElement('button');
    reviewBtn.className = 'tab-btn active';
    reviewBtn.dataset.id = 'review';
    reviewBtn.innerText = '⭐ 收藏复习';
    reviewBtn.onclick = () => switchPage('review');
    tabsContainer.appendChild(reviewBtn);

    const reviewPage = document.createElement('div');
    reviewPage.id = 'page-review';
    reviewPage.className = 'page show';
    reviewPage.innerHTML = '<div id="review-grid"></div>';
    pagesContainer.appendChild(reviewPage);

    // 遍历数据源生成页面与标签
    Object.keys(appData).forEach(key => {
        const group = appData[key];
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.dataset.id = key;
        btn.innerText = group.title;
        btn.onclick = () => switchPage(key);
        tabsContainer.appendChild(btn);

        const page = document.createElement('div');
        page.id = `page-${key}`;
        page.className = 'page';

        let gridClass = 'grid-sentence';
        if (group.layout === 'word') gridClass = 'grid-word';
        else if (group.layout === 'phrase') gridClass = 'grid-phrase';
        else if (group.layout === 'long-sentence') gridClass = 'grid-long-sentence';
        else if (group.layout === 'dialogue') gridClass = 'grid-dialogue';

        const grid = document.createElement('div');
        grid.className = gridClass;

        group.items.forEach((item, idx) => {
            const uniqueId = `${key}-${idx}`;
            const isStarred = starredItems.some(x => x.id === uniqueId);
            
            if (group.layout === 'dialogue') {
                const row = document.createElement('div');
                row.className = `dialogue-row ${item[2] || 'left'}`;
                
                const avatarChar = (item[2] === 'right') ? '👨' : '👩';
                const imgHtml = item[3] ? `<img src="${item[3]}" class="card-img" alt="img">` : '';

                row.innerHTML = `
                    <div class="dialogue-content">
                        <div class="chat-avatar">${avatarChar}</div>
                        <div class="card">
                            <span class="star-icon ${isStarred ? 'active' : ''} star-${uniqueId}" onclick="toggleStar(event, '${key}', ${idx})">★</span>
                            ${imgHtml}
                            <div class="big">${item[0]}</div>
                            <div class="small">${item[1]}</div>
                        </div>
                    </div>
                `;
                row.querySelector('.card').onclick = () => { stopAutoplay(); speak(item[0]); };
                grid.appendChild(row);
            } else {
                const card = document.createElement('div');
                card.className = 'card';
                const imgHtml = item[2] ? `<img src="${item[2]}" class="card-img" alt="img">` : '';

                card.innerHTML = `
                    <span class="star-icon ${isStarred ? 'active' : ''} star-${uniqueId}" onclick="toggleStar(event, '${key}', ${idx})">★</span>
                    ${imgHtml}
                    <div class="big">${item[0]}</div>
                    <div class="small">${item[1]}</div>
                `;
                card.onclick = () => { stopAutoplay(); speak(item[0]); };
                grid.appendChild(card);
            }
        });

        page.appendChild(grid);
        pagesContainer.appendChild(page);
    });

    initPetVisibility();
    updatePetUI();
    startHungerTick();
    switchPage('review');
}

    btn.classList.remove('active');

function clearPracticeView() {
    const existBox = document.getElementById('practice-box');
    if (existBox) existBox.remove();
}

function setAudioMatchMode(enabled) {
    isAudioMatchMode = enabled;
    renderPracticeGroup();
}

function initPracticeGame() {
    clearPracticeView();
    let sourceItems = (currentActivePageId === 'review') ? starredItems.map(x => x.data) : appData[currentActivePageId].items;

    if (sourceItems.length === 0) {
        alert("当前页面没有可以练习的词汇哦！");
        quitPracticeMode();
        return;
    }

    practiceItemsAll = sourceItems.map((item, idx) => ({ id: idx, german: item[0], translation: item[1] }));
    practiceGroupIndex = 0;
    
    document.querySelectorAll('.page').forEach(p => { p.style.setProperty('display', 'none', 'important'); p.classList.remove('show'); });
    renderPracticeGroup();
}

function navigatePracticeGroup(step) {
    if (isAnimating) return;
    const totalGroups = Math.ceil(practiceItemsAll.length / 8);
    const newIndex = practiceGroupIndex + step;
    if (newIndex >= 0 && newIndex < totalGroups) {
        practiceGroupIndex = newIndex;
        renderPracticeGroup();
    }
}

function renderPracticeGroup() {
    const startIdx = practiceGroupIndex * 8;
    const currentGroup = practiceItemsAll.slice(startIdx, startIdx + 8);
    const totalGroups = Math.ceil(practiceItemsAll.length / 8);

    if (currentGroup.length === 0) {
        showCelebrationModal("太棒了！本页连连看项目全部完成！");
        quitPracticeMode();
        return;
    }

    clearPracticeView();

    const practiceBox = document.createElement('div');
    practiceBox.id = 'practice-box';
    practiceBox.className = 'practice-container';

    practiceBox.innerHTML = `
        <div class="score-board">
            <span>得分: <span id="score-display">${userScore}</span></span>
            <span class="streak-badge" id="streak-display">${currentStreak > 1 ? `🔥 ${currentStreak} 连胜!` : ''}</span>
        </div>
        <div class="practice-header">
            <div class="sub-controls">
                <button class="sub-btn ${!isAudioMatchMode ? 'active' : ''}" onclick="setAudioMatchMode(false)">标准</button>
                <button class="sub-btn ${isAudioMatchMode ? 'active' : ''}" onclick="setAudioMatchMode(true)">🔊 听音</button>
            </div>
            <h3>🎮 连连看 (${practiceGroupIndex + 1}/${totalGroups})</h3>
            <div class="page-controls">
                <button class="nav-arrow" ${practiceGroupIndex === 0 ? 'disabled' : ''} onclick="navigatePracticeGroup(-1)">◀</button>
                <button class="nav-arrow" ${practiceGroupIndex >= totalGroups - 1 ? 'disabled' : ''} onclick="navigatePracticeGroup(1)">▶</button>
            </div>
        </div>
        <div class="practice-board">
            <div class="practice-column" id="german-col"></div>
            <div class="practice-column" id="translation-col"></div>
        </div>
    `;

    document.getElementById('pagesContainer').appendChild(practiceBox);

    const germanCol = document.getElementById('german-col');
    const translationCol = document.getElementById('translation-col');
    const shuffledGerman = [...currentGroup].sort(() => Math.random() - 0.5);
    const shuffledTranslation = [...currentGroup].sort(() => Math.random() - 0.5);

    selectedGermanCard = null;
    selectedTranslationCard = null;
    isAnimating = false;

    shuffledGerman.forEach(item => {
        const card = document.createElement('div');
        card.className = 'practice-card';
        card.dataset.id = item.id;
        card.dataset.german = item.german;
        
        if (isAudioMatchMode) {
            card.innerHTML = `
                <div class="wave-container" id="wave-${item.id}">
                    <span class="wave-icon">🔊</span>
                    <div class="wave-bar static"></div>
                    <div class="wave-bar static"></div>
                    <div class="wave-bar static"></div>
                    <div class="wave-bar static"></div>
                    <div class="wave-bar static"></div>
                    <div class="wave-bar static"></div>
                </div>
            `;
        } else {
            card.innerText = item.german;
        }

        card.onclick = (e) => { if(!isAnimating) selectGermanCard(card, item.german, item.id, e); };
        germanCol.appendChild(card);
    });

    shuffledTranslation.forEach(item => {
        const card = document.createElement('div');
        card.className = 'practice-card';
        card.innerText = item.translation;
        card.dataset.id = item.id;
        card.onclick = (e) => { if(!isAnimating) selectTranslationCard(card, e); };
        translationCol.appendChild(card);
    });
}

function selectGermanCard(cardElement, text, id, event) {
    if (cardElement.classList.contains('success')) return;

    const waveContainer = document.getElementById(`wave-${id}`);
    speak(text, () => {
        if (waveContainer) waveContainer.classList.remove('playing');
    }, () => {
        if (waveContainer) waveContainer.classList.add('playing');
    });

    if (selectedGermanCard) { selectedGermanCard.classList.remove('selected'); }
    selectedGermanCard = cardElement;
    selectedGermanCard.classList.add('selected');
    checkMatch(event);
}

function selectTranslationCard(cardElement, event) {
    if (cardElement.classList.contains('success')) return;

    if (selectedTranslationCard) { selectedTranslationCard.classList.remove('selected'); }
    selectedTranslationCard = cardElement;
    selectedTranslationCard.classList.add('selected');
    checkMatch(event);
}

function checkMatch(event) {
    if (!selectedGermanCard || !selectedTranslationCard) return;

    const germanId = selectedGermanCard.dataset.id;
    const translationId = selectedTranslationCard.dataset.id;

    if (germanId === translationId) {
        const c1 = selectedGermanCard;
        const c2 = selectedTranslationCard;
        
        c1.classList.remove('selected');
        c2.classList.remove('selected');
        c1.classList.add('success');
        c2.classList.add('success');

        if (isAudioMatchMode) { c1.innerText = c1.dataset.german; }

        updateScore(10);
        if (event) triggerConfetti(event.clientX, event.clientY);

        selectedGermanCard = null;
        selectedTranslationCard = null;

        const remaining = document.querySelectorAll('.practice-card:not(.success)');
        if (remaining.length === 0) {
            isAnimating = true;
            setTimeout(() => {
                const totalGroups = Math.ceil(practiceItemsAll.length / 8);
                if (practiceGroupIndex + 1 >= totalGroups) {
                    showCelebrationModal("🎉 太棒了！您已成功打通本页所有连连看！");
                    quitPracticeMode();
                } else {
                    practiceGroupIndex++;
                    renderPracticeGroup();
                }
            }, 700);
        }
    } else {
        isAnimating = true;
        const c1 = selectedGermanCard;
        const c2 = selectedTranslationCard;
        
        c1.classList.remove('selected');
        c2.classList.remove('selected');
        c1.classList.add('error');
        c2.classList.add('error');

        updateScore(0);

        selectedGermanCard = null;
        selectedTranslationCard = null;

        setTimeout(() => {
            c1.classList.remove('error');
            c2.classList.remove('error');
            isAnimating = false;
        }, 400);
    }
}

// 🧩 拼词逻辑
function toggleBuilderMode() {
    if (isAutoplayRunning) stopAutoplay();
    if (isPracticeModeActive) quitPracticeMode();
    if (isImageModeActive) quitImageMode();

    const btn = document.getElementById('builderBtn');
    if (isBuilderModeActive) {
        quitBuilderMode();
    } else {
        isBuilderModeActive = true;
        btn.innerHTML = "❌ 退出";
        btn.classList.add('active');
        initBuilderGame();
    }
}

function quitBuilderMode() {
    isBuilderModeActive = false;
    isAnimating = false;
    const btn = document.getElementById('builderBtn');
    btn.innerHTML = "🧩 拼词";
    btn.classList.remove('active');
    clearBuilderView();
    switchPage(currentActivePageId);
}

function clearBuilderView() {
    const existBox = document.getElementById('builder-box');
    if (existBox) existBox.remove();
}

function setBuilderDifficulty(diff) {
    builderDifficulty = diff;
    initBuilderGame();
}

function initBuilderGame() {
    clearBuilderView();
    let sourceItems = (currentActivePageId === 'review') ? starredItems.map(x => ({
        german: x.data[0], translation: x.data[1]
    })) : appData[currentActivePageId].items.map(x => ({
        german: x[0], translation: x[1]
    }));

    if (sourceItems.length === 0) {
        alert("当前页面没有可以练习的内容哦！");
        quitBuilderMode();
        return;
    }

    builderItemsAll = sourceItems;
    builderIndex = 0;

    document.querySelectorAll('.page').forEach(p => { p.style.setProperty('display', 'none', 'important'); p.classList.remove('show'); });
    renderBuilderQuestion();
}

function navigateBuilderQuestion(step) {
    if (isAnimating) return;
    const newIndex = builderIndex + step;
    if (newIndex >= 0 && newIndex < builderItemsAll.length) {
        builderIndex = newIndex;
        renderBuilderQuestion();
    }
}

function renderBuilderQuestion() {
    clearBuilderView();
    builderErrorCount = 0;

    if (builderIndex >= builderItemsAll.length) {
        showCelebrationModal("🎉 恭喜！您已完美通关本页拼词任务！");
        quitBuilderMode();
        return;
    }

    const currentItem = builderItemsAll[builderIndex];
    const germanText = currentItem.german.trim();

    if (builderDifficulty === 1) {
        builderExpectedTokens = germanText.split(/\s+/);
    } else {
        builderExpectedTokens = germanText.split('');
    }

    builderTokensPool = builderExpectedTokens.map((token, idx) => ({ id: idx, token: token }));
    builderTokensPool.sort(() => Math.random() - 0.5);
    builderSelectedTokens = [];

    const builderBox = document.createElement('div');
    builderBox.id = 'builder-box';
    builderBox.className = 'practice-container';

    builderBox.innerHTML = `
        <div class="score-board">
            <span>得分: <span id="score-display">${userScore}</span></span>
            <span class="streak-badge" id="streak-display">${currentStreak > 1 ? `🔥 ${currentStreak} 连胜!` : ''}</span>
        </div>
        <div class="practice-header">
            <div class="sub-controls">
                <button class="sub-btn ${builderDifficulty === 1 ? 'active' : ''}" onclick="setBuilderDifficulty(1)">1. 拼句</button>
                <button class="sub-btn ${builderDifficulty === 2 ? 'active' : ''}" onclick="setBuilderDifficulty(2)">2. 拼词</button>
                <button class="sub-btn ${builderDifficulty === 3 ? 'active' : ''}" onclick="setBuilderDifficulty(3)">3. 盲拼</button>
            </div>
            <h3>🧩 (${builderIndex + 1}/${builderItemsAll.length})</h3>
            <div class="page-controls">
                <button class="nav-arrow" ${builderIndex === 0 ? 'disabled' : ''} onclick="navigateBuilderQuestion(-1)">◀</button>
                <button class="nav-arrow" ${builderIndex >= builderItemsAll.length - 1 ? 'disabled' : ''} onclick="navigateBuilderQuestion(1)">▶</button>
            </div>
        </div>
        <div class="builder-target-prompt">
            <span>${currentItem.translation}</span>
            <button class="speaker-btn" title="听读音" onclick="speakCurrentTarget()">🔊</button>
        </div>
        <div class="builder-answer-zone" id="builder-answer-zone"></div>
        <div class="correct-answer-hint" id="correct-hint">💡 正确答案：${germanText}</div>
        
        ${builderDifficulty === 3 ? renderGermanKeyboardHTML() : '<div class="builder-pool-zone" id="builder-pool-zone"></div>'}

        <div class="builder-actions">
            <button class="btn-clear" onclick="clearBuilderSelection()">🔄 重置</button>
            <button class="btn-check" onclick="checkBuilderAnswer(event)">✅ 检查答案</button>
        </div>
    `;

    document.getElementById('pagesContainer').appendChild(builderBox);

    if (builderDifficulty !== 3) {
        renderBuilderTiles();
    } else {
        renderKeyboardAnswerZone();
    }

    if (builderDifficulty === 3) { speakCurrentTarget(); }
}

function renderGermanKeyboardHTML() {
    return `
        <div class="virtual-keyboard">
            <div class="keyboard-row">
                ${['Q','W','E','R','T','Z','U','I','O','P','Ü'].map(k => `<button class="key-btn" onclick="pressVirtualKey('${k}')">${k}</button>`).join('')}
            </div>
            <div class="keyboard-row">
                ${['A','S','D','F','G','H','J','K','L','Ö','Ä'].map(k => `<button class="key-btn" onclick="pressVirtualKey('${k}')">${k}</button>`).join('')}
            </div>
            <div class="keyboard-row">
                ${['Y','X','C','V','B','N','M','ß',',','.'].map(k => `<button class="key-btn" onclick="pressVirtualKey('${k}')">${k}</button>`).join('')}
                <button class="key-btn wide" onclick="pressVirtualKey('BACK')">⌫</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn space" onclick="pressVirtualKey(' ')">Space</button>
            </div>
        </div>
    `;
}

function pressVirtualKey(key) {
    if (key === 'BACK') {
        builderSelectedTokens.pop();
    } else {
        builderSelectedTokens.push({ id: Date.now() + Math.random(), token: key });
    }
    renderKeyboardAnswerZone();
}

function renderKeyboardAnswerZone() {
    const answerZone = document.getElementById('builder-answer-zone');
    if (!answerZone) return;
    answerZone.innerHTML = '';

    builderSelectedTokens.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'tile-btn';
        btn.innerText = item.token === ' ' ? '␣' : item.token;
        btn.onclick = () => {
            builderSelectedTokens.splice(index, 1);
            renderKeyboardAnswerZone();
        };
        answerZone.appendChild(btn);
    });
}

function speakCurrentTarget() {
    if (builderItemsAll[builderIndex]) { speak(builderItemsAll[builderIndex].german); }
}

function renderBuilderTiles() {
    const answerZone = document.getElementById('builder-answer-zone');
    const poolZone = document.getElementById('builder-pool-zone');
    if (!answerZone || !poolZone) return;

    answerZone.innerHTML = '';
    poolZone.innerHTML = '';

    builderSelectedTokens.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'tile-btn';
        btn.innerText = item.token === ' ' ? '␣' : item.token;
        btn.onclick = () => {
            if (builderDifficulty === 1) speak(item.token);
            builderSelectedTokens.splice(index, 1);
            renderBuilderTiles();
        };
        answerZone.appendChild(btn);
    });

    builderTokensPool.forEach((item) => {
        const btn = document.createElement('button');
        btn.className = 'tile-btn';
        btn.innerText = item.token === ' ' ? '␣' : item.token;

        const isSelected = builderSelectedTokens.some(s => s.id === item.id);
        if (isSelected) {
            btn.classList.add('disabled');
        } else {
            btn.onclick = () => {
                if (builderDifficulty === 1) speak(item.token);
                builderSelectedTokens.push(item);
                renderBuilderTiles();
            };
        }
        poolZone.appendChild(btn);
    });
}

function clearBuilderSelection() {
    builderSelectedTokens = [];
    if (builderDifficulty === 3) {
        renderKeyboardAnswerZone();
    } else {
        renderBuilderTiles();
    }
}

function normalizeString(str) {
    return str
        .toLowerCase()
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'“”—]/g, "") 
        .replace(/\s+/g, " ")                             
        .trim();
}

function checkBuilderAnswer(event) {
    if (isAnimating) return;

    const answerZone = document.getElementById('builder-answer-zone');
    const hint = document.getElementById('correct-hint');
    const currentItem = builderItemsAll[builderIndex];

    const rawUserAnswer = builderSelectedTokens.map(t => t.token).join(builderDifficulty === 1 ? ' ' : '');
    const cleanUserAnswer = normalizeString(rawUserAnswer);
    const cleanCorrectAnswer = normalizeString(currentItem.german);

    if (cleanUserAnswer === cleanCorrectAnswer) {
        isAnimating = true;
        if (hint) hint.classList.remove('show');
        answerZone.classList.add('success');
        updateScore(15);
        if (event) triggerConfetti(event.clientX, event.clientY);

        speak(currentItem.german, () => {
            setTimeout(() => {
                if (builderIndex + 1 >= builderItemsAll.length) {
                    showCelebrationModal("🎉 完美通关！拼词训练圆满完成！");
                    quitBuilderMode();
                } else {
                    builderIndex++;
                    isAnimating = false;
                    renderBuilderQuestion();
                }
            }, 600);
        });
    } else {
        builderErrorCount++;
        isAnimating = true;
        answerZone.classList.add('error');
        updateScore(0);

        if (builderErrorCount >= 3 && hint) { 
            hint.classList.add('show'); 
        }

        setTimeout(() => {
            answerZone.classList.remove('error');
            isAnimating = false;
        }, 500);
    }
}

// 🖼️ 选图模式
function toggleImageMode() {
    if (isAutoplayRunning) stopAutoplay();
    if (isPracticeModeActive) quitPracticeMode();
    if (isBuilderModeActive) quitBuilderMode();

    const btn = document.getElementById('imageBtn');
    if (isImageModeActive) {
        quitImageMode();
    } else {
        isImageModeActive = true;
        btn.innerHTML = "❌ 退出";
        btn.classList.add('active');
        initImageGame();
    }
}

function quitImageMode() {
    isImageModeActive = false;
    isAnimating = false;
    const btn = document.getElementById('imageBtn');
    btn.innerHTML = "🖼️ 选图";
    btn.classList.remove('active');
    clearImageView();
    switchPage(currentActivePageId);
}

function clearImageView() {
    const existBox = document.getElementById('image-box');
    if (existBox) existBox.remove();
}

function initImageGame() {
    clearImageView();
    let rawList = [];

    if (currentActivePageId === 'review') {
        starredItems.forEach(x => {
            const img = (x.layout === 'dialogue') ? x.data[3] : x.data[2];
            if (img) rawList.push({ german: x.data[0], translation: x.data[1], imgUrl: img });
        });
    } else {
        const page = appData[currentActivePageId];
        page.items.forEach(item => {
            const img = (page.layout === 'dialogue') ? item[3] : item[2];
            if (img) rawList.push({ german: item[0], translation: item[1], imgUrl: img });
        });
    }

    if (rawList.length < 2) {
        alert("当前分组带图片的卡片不足 2 张，无法生成选图测验！");
        quitImageMode();
        return;
    }

    imageModeItemsAll = rawList.sort(() => Math.random() - 0.5);
    imageModeIndex = 0;

    document.querySelectorAll('.page').forEach(p => { p.style.setProperty('display', 'none', 'important'); p.classList.remove('show'); });
    renderImageQuestion();
}

function navigateImageQuestion(step) {
    if (isAnimating) return;
    const newIndex = imageModeIndex + step;
    if (newIndex >= 0 && newIndex < imageModeItemsAll.length) {
        imageModeIndex = newIndex;
        renderImageQuestion();
    }
}

function renderImageQuestion() {
    clearImageView();

    if (imageModeIndex >= imageModeItemsAll.length) {
        showCelebrationModal("🎉 恭喜！你已完成本组听音选图测试！");
        quitImageMode();
        return;
    }

    const currentCorrect = imageModeItemsAll[imageModeIndex];
    let localDistractors = imageModeItemsAll.filter(item => item.german !== currentCorrect.german).sort(() => Math.random() - 0.5);
    let options = [currentCorrect, ...localDistractors.slice(0, 3)].sort(() => Math.random() - 0.5);

    const imageBox = document.createElement('div');
    imageBox.id = 'image-box';
    imageBox.className = 'practice-container';

    imageBox.innerHTML = `
        <div class="score-board">
            <span>得分: <span id="score-display">${userScore}</span></span>
            <span class="streak-badge" id="streak-display">${currentStreak > 1 ? `🔥 ${currentStreak} 连胜!` : ''}</span>
        </div>
        <div class="practice-header">
            <h3>👂 听音选图 (${imageModeIndex + 1}/${imageModeItemsAll.length})</h3>
            <div class="page-controls">
                <button class="nav-arrow" ${imageModeIndex === 0 ? 'disabled' : ''} onclick="navigateImageQuestion(-1)">◀</button>
                <button class="nav-arrow" ${imageModeIndex >= imageModeItemsAll.length - 1 ? 'disabled' : ''} onclick="navigateImageQuestion(1)">▶</button>
            </div>
        </div>
        <div class="builder-target-prompt">
            <button class="speaker-btn" title="播放读音" onclick="speakImageTarget()">🔊</button>
            <span id="image-german-reveal" style="margin-left:8px;">请听发音选图</span>
        </div>
        <div class="image-grid" id="image-grid"></div>
    `;

    document.getElementById('pagesContainer').appendChild(imageBox);

    const grid = document.getElementById('image-grid');
    options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'image-choice-card';
        card.innerHTML = `<img src="${opt.imgUrl}" alt="choice">`;
        card.onclick = (e) => { if(!isAnimating) checkImageChoice(card, opt.german, currentCorrect.german, e); };
        grid.appendChild(card);
    });

    setTimeout(() => speakImageTarget(), 300);
}

function speakImageTarget() {
    if (imageModeItemsAll[imageModeIndex]) { speak(imageModeItemsAll[imageModeIndex].german); }
}

function checkImageChoice(cardElement, chosenGerman, correctGerman, event) {
    const revealSpan = document.getElementById('image-german-reveal');

    if (chosenGerman === correctGerman) {
        isAnimating = true;
        cardElement.classList.add('success');
        if (revealSpan) { revealSpan.innerHTML = `<b style="color:#22c55e;">${correctGerman}</b>`; }

        updateScore(10);
        if (event) triggerConfetti(event.clientX, event.clientY);

        setTimeout(() => {
            if (imageModeIndex + 1 >= imageModeItemsAll.length) {
                showCelebrationModal("🎉 恭喜！你已完成本组听音选图测试！");
                quitImageMode();
            } else {
                imageModeIndex++;
                isAnimating = false;
                renderImageQuestion();
            }
        }, 1200);
    } else {
        isAnimating = true;
        cardElement.classList.add('error');
        updateScore(0);

        setTimeout(() => {
            cardElement.classList.remove('error');
            isAnimating = false;
        }, 500);
    }
}

// 页面加载完毕自动初始化
window.onload = initApp;
</script>
